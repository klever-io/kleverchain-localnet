services:
  seednode:
    image: kleverapp/klever-go:v1.7.16-0-gcf9f612c
    container_name: seednode
    restart: unless-stopped
    volumes:
      - ./config/seednode:/opt/klever-blockchain/config/seednode
    entrypoint: /usr/local/bin/seednode
    command:
      - "--rest-api-interface=0.0.0.0:8799"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8799/node/status || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    mem_limit: 2g
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      klever:
        ipv4_address: 172.25.0.5

  node0:
    image: kleverapp/klever-go:v1.7.16-0-gcf9f612c
    container_name: node0
    restart: unless-stopped
    depends_on:
      seednode:
        condition: service_healthy
    networks:
      - klever
    ports:
      - "8800:8800"
    volumes:
      - ./config/node:/opt/klever-blockchain/config/node
      - ./keys/node-0/validatorKey.pem:/opt/klever-blockchain/config/node/validatorKey.pem
      - ./dbs/node-0/:/opt/klever-blockchain/db
      - ./logs/node-0:/opt/klever-blockchain/logs
    entrypoint: /usr/local/bin/validator
    command:
      - "--log-level=*:INFO"
      - "--use-log-view"
      - "--rest-api-interface=0.0.0.0:8800"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8800/node/status || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    mem_limit: 2g
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  node1:
    image: kleverapp/klever-go:v1.7.16-0-gcf9f612c
    container_name: node1
    restart: unless-stopped
    depends_on:
      seednode:
        condition: service_healthy
    networks:
      - klever
    ports:
      - "8801:8801"
    volumes:
      - ./config/node:/opt/klever-blockchain/config/node
      - ./keys/node-1/validatorKey.pem:/opt/klever-blockchain/config/node/validatorKey.pem
      - ./dbs/node-1/:/opt/klever-blockchain/db
      - ./logs/node-1:/opt/klever-blockchain/logs
    entrypoint: /usr/local/bin/validator
    command:
      - "--log-level=*:INFO"
      - "--use-log-view"
      - "--rest-api-interface=0.0.0.0:8801"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8801/node/status || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    mem_limit: 2g
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  node2:
    image: kleverapp/klever-go:v1.7.16-0-gcf9f612c
    container_name: node2
    restart: unless-stopped
    depends_on:
      seednode:
        condition: service_healthy
    networks:
      - klever
    ports:
      - "8802:8802"
    volumes:
      - ./config/node:/opt/klever-blockchain/config/node
      - ./keys/node-2/validatorKey.pem:/opt/klever-blockchain/config/node/validatorKey.pem
      - ./dbs/node-2/:/opt/klever-blockchain/db
      - ./logs/node-2:/opt/klever-blockchain/logs
    entrypoint: /usr/local/bin/validator
    command:
      - "--log-level=*:INFO"
      - "--use-log-view"
      - "--rest-api-interface=0.0.0.0:8802"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8802/node/status || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    mem_limit: 2g
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

networks:
  klever:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/24
